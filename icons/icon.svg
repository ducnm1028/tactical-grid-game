<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#blueGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Tactical Grid Lines -->
  <g stroke="#1e293b" stroke-width="2" opacity="0.6">
    <line x1="96" y1="96" x2="416" y2="96"/>
    <line x1="96" y1="176" x2="416" y2="176"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
    <line x1="96" y1="336" x2="416" y2="336"/>
    <line x1="96" y1="416" x2="416" y2="416"/>
    <line x1="96" y1="96" x2="96" y2="416"/>
    <line x1="176" y1="96" x2="176" y2="416"/>
    <line x1="256" y1="96" x2="256" y2="416"/>
    <line x1="336" y1="96" x2="336" y2="416"/>
    <line x1="416" y1="96" x2="416" y2="416"/>
  </g>

  <!-- Blue Energy Wave (Left) -->
  <circle cx="160" cy="256" r="44" fill="url(#blueGrad)" opacity="0.85" filter="url(#neonGlow)"/>
  <circle cx="160" cy="256" r="28" fill="#e0f2fe"/>

  <!-- Red Energy Wave (Right) -->
  <circle cx="352" cy="256" r="44" fill="url(#redGrad)" opacity="0.85" filter="url(#neonGlow)"/>
  <circle cx="352" cy="256" r="28" fill="#ffe4e6"/>

  <!-- Center Chrono Hourglass / Tactical Shield -->
  <path d="M 216 140 L 296 140 L 272 232 L 296 324 L 216 324 L 240 232 Z" 
        fill="url(#goldGrad)" 
        stroke="#fef08a" 
        stroke-width="6" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Center Clash Sparks -->
  <circle cx="256" cy="232" r="14" fill="#ffffff" filter="url(#neonGlow)"/>

  <!-- Chrono Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="16 12" opacity="0.7"/>

  <!-- Title Text -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#38bdf8" text-anchor="middle" letter-spacing="4">CHRONO CLASH</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#f59e0b" text-anchor="middle" letter-spacing="2">WEGO TACTICS 20x7</text>
</svg>
